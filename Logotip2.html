<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickJurist - Legal Tech Identity</title>
    <!-- Font: Inter for modern, clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0F172A;
            --primary-blue: #0052FF;
            --accent-cyan: #00F0FF;
            --text-white: #FFFFFF;
            --text-muted: #94A3B8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-white);
        }

        .brand-container {
            text-align: center;
            padding: 48px;
            /* Subtle glassmorphism card effect */
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            max-width: 400px;
            width: 100%;
            position: relative;               /* for overlay positioning */
        }

        .brand-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 32px 64px rgba(0, 82, 255, 0.15);
            border-color: rgba(0, 82, 255, 0.2);
        }

        /* ----- Shield (light‑gray) ----- */
        .shield-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            /* Shield moved down by 4 % (from the previous –11 % up) */
            transform: translate(-50%, -57%); /* -50% (center) – 7% (net upward) */
            width: 225px;          /* 180 px × 1.25 */
            height: 225px;
            pointer-events: none;  /* let clicks go through to the scales */
        }
        .shield-bg path {
            fill: rgba(255,255,255,0.08); /* very light gray */
        }

        /* ----- Scales image ----- */
        .scales-img {
            width: 120px;          /* 160 px × 0.75 */
            height: 120px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            filter: drop-shadow(0 0 20px rgba(0, 82, 255, 0.15));
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center;
            /* shift down 30% of its own height (15% + another 15%) */
            transform: translateY(30%);
            position: relative;    /* keep it on top of the shield */
            z-index: 2;
            margin-bottom: 32px;   /* space to the text */
        }

        .brand-container:hover .scales-img {
            /* keep the 30% down‑shift and add hover scale */
            transform: translateY(30%) scale(1.05);
        }

        /* ----- Typography ----- */
        .brand-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin: 0;
            line-height: 1.2;
            color: var(--text-white);
        }

        .brand-highlight {
            color: var(--accent-cyan);
            position: relative;
            display: inline-block;
        }
        .brand-highlight::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-cyan);
            opacity: 0.3;
            border-radius: 2px;
        }

        .tagline-height: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-top: 12px;
            opacity: 0.9;
        }

        /* ----- Responsive adjustments ----- */
        @media (max-width: 480px) {
            .brand-container {
                padding: 32px 24px;
                border-radius: 24px;
            }
            .shield-bg {
                width: 175px;   /* 140 px × 1.25 */
                height: 175px;
            }
            .scales-img {
                width: 90px;    /* 120 px × 0.75 */
                height: 90px;
                /* shift down 30% of its own height (same proportion) */
                transform: translateY(30%);
                margin-bottom: 24px;
            }
            .brand-container:hover .scales-img {
                transform: translateY(30%) scale(1.05);
            }
            .brand-name {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="brand-container">
        <!-- Light‑gray shield background (scaled to be 25 % larger) -->
        <svg class="shield-bg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M65,60 C65,60,50,65,50,85 C50,115,100,145,100,145
                     C100,145,150,115,150,85 C150,65,135,60,135,60 L65,60 Z"/>
        </svg>

        <!-- Scales of Justice – PNG from Flaticon (scaled down‑scaled 25 % ) -->
        <img class="scales-img"
             src="https://cdn-icons-png.flaticon.com/512/18569/18569911.png"
             alt="Scales of Justice"
             aria-label="Scales of Justice">

        <!-- Typography Lockup (Below Icon) -->
        <h1 class="brand-name">
            CLICK<span class="brand-highlight">JURIST</span>
        </h1>
        <p class="tagline">Instant Legal Authority</p>
    </div> 

</body>
</html>
